<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>모바일 미리보기 (390px)</title>
<style>
  html,body{margin:0;height:100%;background:#efe7f5}
  body{display:flex;justify-content:center;align-items:center;gap:34px;padding:20px;font-family:system-ui,sans-serif}
  .phone{transform:scale(.74);transform-origin:center center}
  .screen{
    width:390px;height:844px;overflow:hidden;border-radius:26px;background:#fff;
    box-shadow:0 18px 40px -18px rgba(60,40,80,.55), 0 0 0 6px #fff;
  }
  iframe{width:390px;height:844px;border:0;display:block}
  .cap{text-align:center;font-size:12px;color:#8b7fa0;margin-top:10px}
</style>
</head>
<body>
  <div>
    <div class="phone"><div class="screen"><iframe src="./index.html" title="모바일 1면: 오피스 맵과 채팅"></iframe></div></div>
    <div class="cap">1면 · 오피스 맵 + 채팅</div>
  </div>
  <div>
    <div class="phone"><div class="screen"><iframe src="./index.html#board" title="모바일 2면: 공유 업무 보드"></iframe></div></div>
    <div class="cap">2면 · 공유 업무 보드</div>
  </div>
</body>
</html>
